name: Validate TTP library
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Check TTP modules, documentation and tests
        run: npm run check
      - name: Export versioned TTP articles
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: npm run library:export-website
      - uses: actions/upload-artifact@v4
        with:
          name: website-ttps
          path: website-export/bundle.json
          retention-days: 14
          if-no-files-found: error
